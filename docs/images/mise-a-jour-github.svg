<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Mettre à jour le fichier Excel sur GitHub</title>
  <desc id="desc">Quatre étapes montrent le dossier gestion-tarifs, Add file, Upload files, Commit changes et le voyant vert Actions.</desc>
  <rect width="1400" height="720" rx="34" fill="#f6f7f8"/><text x="55" y="66" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">Mise à jour des tarifs sur GitHub</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 105)"><rect width="610" height="225" rx="22" fill="white" stroke="#d0d7de" stroke-width="3"/><circle cx="38" cy="40" r="20" fill="#7f2171"/><text x="38" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">1</text><text x="73" y="47" font-size="23" font-weight="700" fill="#24292f">Ouvrir le dossier gestion-tarifs</text><rect x="30" y="84" width="550" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="52" y="119" font-size="17" fill="#57606a">krono-plus-aura.github.io /</text><text x="288" y="119" font-size="17" font-weight="700" fill="#0969da">gestion-tarifs</text><text x="52" y="158" font-size="18" font-weight="700" fill="#24292f">📄 Base_tarifaire_KRONO_plus.xlsx</text></g>
    <g transform="translate(735 105)"><rect width="610" height="225" rx="22" fill="white" stroke="#d0d7de" stroke-width="3"/><circle cx="38" cy="40" r="20" fill="#9c187a"/><text x="38" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">2</text><text x="73" y="47" font-size="23" font-weight="700" fill="#24292f">Choisir Add file puis Upload files</text><rect x="98" y="95" width="165" height="55" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="180" y="129" text-anchor="middle" font-size="19" font-weight="700" fill="#24292f">Add file ▾</text><path d="M277 122h42" stroke="#b21571" stroke-width="5" stroke-linecap="round"/><path d="M308 109l14 13-14 13" fill="none" stroke="#b21571" stroke-width="5"/><rect x="335" y="95" width="180" height="55" rx="10" fill="#ddf4ff" stroke="#54aeff"/><text x="425" y="129" text-anchor="middle" font-size="19" font-weight="700" fill="#0969da">Upload files</text></g>
    <g transform="translate(55 390)"><rect width="610" height="250" rx="22" fill="white" stroke="#d0d7de" stroke-width="3"/><circle cx="38" cy="40" r="20" fill="#b21571"/><text x="38" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">3</text><text x="73" y="47" font-size="23" font-weight="700" fill="#24292f">Déposer l’Excel et valider</text><rect x="30" y="82" width="550" height="76" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="8 7"/><text x="305" y="127" text-anchor="middle" font-size="18" fill="#24292f">Base_tarifaire_KRONO_plus.xlsx</text><rect x="335" y="180" width="245" height="52" rx="10" fill="#1f883d"/><text x="458" y="213" text-anchor="middle" font-size="19" font-weight="700" fill="white">Commit changes</text></g>
    <g transform="translate(735 390)"><rect width="610" height="250" rx="22" fill="white" stroke="#d0d7de" stroke-width="3"/><circle cx="38" cy="40" r="20" fill="#e41d25"/><text x="38" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">4</text><text x="73" y="47" font-size="23" font-weight="700" fill="#24292f">Vérifier le voyant vert</text><rect x="34" y="84" width="120" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="94" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">Actions</text><circle cx="95" cy="181" r="27" fill="#1a7f37"/><path d="M82 181l9 9 18-20" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="188" font-size="20" font-weight="700" fill="#1a7f37">Publication réussie</text><text x="35" y="226" font-size="16" fill="#57606a">Rouge = ancienne version conservée, demander de l’aide.</text></g>
  </g>
</svg>
