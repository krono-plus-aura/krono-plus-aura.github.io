    const cardField=document.createElement("div");cardField.className="field";const cardLabel=document.createElement("label");cardLabel.htmlFor="traveler-card-"+traveler.id;cardLabel.textContent="Carte / tarif";const cardSelect=document.createElement("select");cardSelect.id=cardLabel.htmlFor;cardSelect.dataset.action="profile";profilesByType[traveler.type].forEach(profile=>cardSelect.appendChild(option(profile.id,profile.label,profile.id===traveler.profileId)));cardField.append(cardLabel,cardSelect);
    fields.append(typeField,cardField);card.append(top,fields);travelerList.appendChild(card)});
}
function addNewTraveler(type="adult"){travelers.push({id:nextTravelerId++,type,profileId:defaultProfile(type)});renderTravelers();markDirty()}
function animateAmount(element,target,prefix="",directional=false){const previous=Number(element.dataset.amount||0),delta=target-previous,activeFrame=amountAnimations.get(element);if(activeFrame)cancelAnimationFrame(activeFrame);element.dataset.amount=String(target);element.classList.remove("is-increasing","is-decreasing");if(directional&&delta!==0)element.classList.add(delta>0?"is-increasing":"is-decreasing");if(reducedMotion.matches||delta===0){element.textContent=prefix+money(target);element.classList.remove("is-increasing","is-decreasing");return}const start=performance.now(),duration=540;const step=now=>{const progress=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-progress,3),value=Math.round(previous+delta*eased);element.textContent=prefix+money(value);if(progress<1)amountAnimations.set(element,requestAnimationFrame(step));else{element.textContent=prefix+money(target);element.classList.remove("is-increasing","is-decreasing");amountAnimations.delete(element)}};amountAnimations.set(element,requestAnimationFrame(step))}
function buildDetail(index,traveler,second,first){const profile=profileById.get(traveler.profileId),card=document.createElement("article");card.className="detail-card";const head=document.createElement("div");head.className="detail-head";const copy=document.createElement("div"),title=document.createElement("div"),profileText=document.createElement("div"),surcharge=document.createElement("div");title.className="detail-title";title.textContent="Voyageur "+(index+1)+" · "+travelerLabel(traveler.type);profileText.className="detail-profile";profileText.textContent=profile.label;surcharge.className="detail-surcharge";surcharge.textContent="+ "+money(first-second);copy.append(title,profileText);head.append(copy,surcharge);const fares=document.createElement("div");fares.className="detail-fares";fares.innerHTML="<span>2de : <strong>"+money(second)+"</strong></span><span>1re : <strong>"+money(first)+"</strong></span>";card.append(head,fares);return card}
function validateAndRender(){const from=fromSelect.value,to=toSelect.value;if(from===to){setMessage("Choisis deux gares différentes.");resultCard.hidden=true;return}const route=DATA.pairs[pairKey(from,to)];if(!route){setMessage("Aucun tarif n’est enregistré pour cette relation.");resultCard.hidden=true;return}let totalSecond=0,totalFirst=0;detailList.replaceChildren();for(const [index,traveler] of travelers.entries()){const fares=route.fares[traveler.profileId];if(!fares){setMessage("Profil tarifaire incomplet pour le voyageur "+(index+1)+".");resultCard.hidden=true;return}const [second,first]=fares;totalSecond+=second;totalFirst+=first;detailList.appendChild(buildDetail(index,traveler,second,first))}const total=totalFirst-totalSecond,caption=$("total-caption");$("journey-from").textContent=stationById.get(from).name;$("journey-to").textContent=stationById.get(to).name;caption.textContent=travelers.length>1?travelers.length+" voyageurs":"";caption.hidden=travelers.length===1;animateAmount($("total-surcharge"),total,"+ ",true);animateAmount($("total-second"),totalSecond);animateAmount($("total-first"),totalFirst);resultCard.hidden=false;setMessage();if(window.matchMedia("(max-width:899px)").matches)resultCard.scrollIntoView({behavior:reducedMotion.matches?"auto":"smooth",block:"start"})}
travelerList.addEventListener("change",event=>{const card=event.target.closest(".traveler-card");if(!card)return;const traveler=travelers.find(item=>item.id===Number(card.dataset.travelerId));if(event.target.dataset.action==="type"){traveler.type=event.target.value;traveler.profileId=defaultProfile(traveler.type);renderTravelers();markDirty()}else if(event.target.dataset.action==="profile"){traveler.profileId=event.target.value;markDirty()}});
travelerList.addEventListener("click",event=>{const button=event.target.closest('[data-action="remove"]');if(!button)return;const card=button.closest(".traveler-card");travelers=travelers.filter(item=>item.id!==Number(card.dataset.travelerId));renderTravelers();markDirty()});
addTraveler.addEventListener("click",()=>{if(travelers.length<9)addNewTraveler("adult")});validateButton.addEventListener("click",validateAndRender);fromSelect.addEventListener("change",()=>markDirty());toSelect.addEventListener("change",()=>markDirty());
try{DATA=JSON.parse($("tariff-fallback-data").textContent);DATA.stations.forEach((station,index)=>{stationById.set(station.id,station);stationIndex.set(station.id,index);fromSelect.appendChild(option(station.id,station.name,index===0));toSelect.appendChild(option(station.id,station.name,index===DATA.stations.length-1))});DATA.profiles.forEach(profile=>{if(!profilesByType[profile.travelerType])profilesByType[profile.travelerType]=[];profilesByType[profile.travelerType].push(profile);profileById.set(profile.id,profile)});travelers=[{id:nextTravelerId++,type:"adult",profileId:defaultProfile("adult")}];renderTravelers();validateButton.disabled=false;document.documentElement.classList.add("js-ready");setMessage()}
catch(error){setMessage("La base tarifaire n’a pas pu être chargée.");console.error(error)}
})();
</script>
